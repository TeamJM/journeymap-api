plugins {
    id 'net.minecraftforge.gradle' version '[7.0,8.0)'
    id 'multiloader-common'
}

def baseName = "${project.mod_name}" + "-common"
base.archivesName = baseName

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

test {
//    useJUnitPlatform()
}

def generatedApiSrc = layout.buildDirectory.dir('generated/sources/apiVersion/java/main')
def apiVersion = (project.snapshot.toBoolean() ? "${project.api_version}-SNAPSHOT" : "${project.api_version}").toString()

// Generate a single constants class holding the build-time API version. IClientAPI
// references JmApiVersion.VERSION, which javac inlines into consumers just like a
// literal. Generating one file (rather than copying the whole tree) lets us add the
// directory as an *additional* source root, so src/main/java stays a real source root
// in the IDE and there are no duplicate classes on the compile path.
def generateApiVersion = tasks.register('generateApiVersion') {
    inputs.property('apiVersion', apiVersion)
    outputs.dir(generatedApiSrc)
    doLast {
        def pkgDir = generatedApiSrc.get().dir('journeymap/api/v2/client').asFile
        pkgDir.mkdirs()
        new File(pkgDir, 'JmApiVersion.java').text = """\
package journeymap.api.v2.client;

/**
 * Build-time generated API version constant. Do not edit - generated by the
 * 'generateApiVersion' task in common/build.gradle from gradle.properties
 * (api_version + snapshot).
 */
public final class JmApiVersion
{
    public static final String VERSION = "${apiVersion}";

    private JmApiVersion() {}
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir(generateApiVersion)
        }
    }
}

// ForgeGradle 7 puts MCP-mapped Minecraft (srg-period MC + MCP snapshot member names) on the
// compile classpath for the 1.12.2 forge dependency below. On 1.12.2 FG7 compiles with MCP names
// natively - no post-compile remap is needed (that machinery was only required on 1.16.5+, where
// the forge userdev jar carries different names than the minivan-mapped common source).
minecraft {
    mappings channel: project.mappings_channel, version: project.mappings
}

// The unit tests (MockClientAPI, TeleportEventTest) reference net.minecraft.* - give the test source
// set the same Minecraft classpath the minecraft dependency added to main's compileOnly, for BOTH
// compile and runtime. Runtime too: the tests boot Minecraft (Bootstrap.bootStrap()) and JUnit reflects
// over MC-referencing classes (MockClientAPI -> Vec3i) during discovery, so MC must be on the test
// runtime classpath or discovery fails with NoClassDefFoundError.
configurations {
    testCompileOnly.extendsFrom compileOnly
    testRuntimeOnly.extendsFrom compileOnly
}

dependencies {
    compileOnly minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")

    // JetBrains annotations (@Nullable/@NotNull/@ApiStatus) - MDG legacyforge provided these
    // transitively; the minecraft dependency provides only Minecraft, so declare them explicitly.
    compileOnly group: 'org.jetbrains', name: 'annotations', version: '24.1.0'
}

tasks.withType(Javadoc).configureEach {
    // Java 8's javadoc doclint rejects some HTML in the API javadoc (e.g. bare '>') that the
    // Java 17 toolchain tolerated. Disable doclint so withJavadocJar() can build.
    options.addStringOption('Xdoclint:none', '-quiet')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    // Expose both the hand-written sources and the generated version constant so the
    // loader modules compile the full common source set with the correct API_VERSION.
    commonJava(file('src/main/java'))
    commonJava(generatedApiSrc) {
        builtBy generateApiVersion
    }
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
