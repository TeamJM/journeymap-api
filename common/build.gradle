plugins {
    id 'net.neoforged.moddev'
    id 'multiloader-common'
}

def baseName = "${project.mod_name}" + "-common"
base.archivesName = baseName

test {
//    useJUnitPlatform()
}

def generatedApiSrc = layout.buildDirectory.dir('generated/sources/apiVersion/java/main')
def apiVersion = (project.snapshot.toBoolean() ? "${project.api_version}-SNAPSHOT" : "${project.api_version}").toString()

// Generate a single constants class holding the build-time API version. IClientAPI
// references JmApiVersion.VERSION, which javac inlines into consumers just like a
// literal. Generating one file (rather than copying the whole tree) lets us add the
// directory as an *additional* source root, so src/main/java stays a real source root
// in the IDE and there are no duplicate classes on the compile path.
def generateApiVersion = tasks.register('generateApiVersion') {
    inputs.property('apiVersion', apiVersion)
    outputs.dir(generatedApiSrc)
    doLast {
        def pkgDir = generatedApiSrc.get().dir('journeymap/api/v2/client').asFile
        pkgDir.mkdirs()
        new File(pkgDir, 'JmApiVersion.java').text = """\
package journeymap.api.v2.client;

/**
 * Build-time generated API version constant. Do not edit — generated by the
 * 'generateApiVersion' task in common/build.gradle from gradle.properties
 * (api_version + snapshot).
 */
public final class JmApiVersion
{
    public static final String VERSION = "${apiVersion}";

    private JmApiVersion() {}
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir(generateApiVersion)
        }
    }
}


neoForge {
    neoFormVersion = neo_form_version
    addModdingDependenciesTo(sourceSets["test"])
    addModdingDependenciesTo(sourceSets["testmod"])
//    parchment {
//        minecraftVersion = mappings_mc_version
//        mappingsVersion = mappings_date
//    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    // Expose both the hand-written sources and the generated version constant so the
    // loader modules compile the full common source set with the correct API_VERSION.
    commonJava(file('src/main/java'))
    commonJava(generatedApiSrc) {
        builtBy generateApiVersion
    }
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
