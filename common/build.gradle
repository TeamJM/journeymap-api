plugins {
    id 'net.neoforged.moddev'
    id 'multiloader-common'
}

def baseName = "${project.mod_name}" + "-common"
base.archivesName = baseName

test {
//    useJUnitPlatform()
}

def generatedApiSrc = layout.buildDirectory.dir('generated/sources/apiVersion/java/main')
def apiVersion = (project.snapshot.toBoolean() ? "${project.api_version}-SNAPSHOT" : "${project.api_version}").toString()

def generateApiSources = tasks.register('generateApiSources', Copy) {
    inputs.property('apiVersion', apiVersion)
    from('src/main/java')
    into(generatedApiSrc)
    filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [API_VERSION: apiVersion])
}

sourceSets {
    main {
        java {
            srcDirs = [generateApiSources]
        }
    }
}


neoForge {
    neoFormVersion = neo_form_version
    addModdingDependenciesTo(sourceSets["test"])
    addModdingDependenciesTo(sourceSets["testmod"])
//    parchment {
//        minecraftVersion = mappings_mc_version
//        mappingsVersion = mappings_date
//    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava(generatedApiSrc) {
        builtBy generateApiSources
    }
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
