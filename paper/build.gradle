plugins {
    id 'net.neoforged.moddev'
    id 'multiloader-loader'
    id 'io.papermc.paperweight.userdev' version "${paperweight_userdev_version}"
    id 'xyz.jpenilla.run-paper' version "${run_paper_version}"
}

def baseName = "${project.mod_name}" + "-paper"
base.archivesName = baseName

// NeoForm provides compile-time access to vanilla Minecraft (including client classes
// like net.minecraft.client.Minecraft, com.mojang.blaze3d.platform.*, and the full
// net.minecraft.* server surface). The published journeymap-api-paper jar therefore
// includes the entire API (common + server + client). Client API classes are inert on
// a Paper server at runtime because no code path instantiates them; their presence in
// the jar is purely for compile-time resolution by consumers (e.g. the JM Paper plugin
// shading this artifact still needs to resolve client-API references in shared code).
neoForge {
    neoFormVersion = neo_form_version
}

// paperweight-userdev still pulls the Paper dev bundle so Paper-specific NMS classes
// resolve when consumers compile against this artifact.
dependencies {
    paperweight.paperDevBundle(paper_version)
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'paper')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'paper')
            }
        }
    }
}

// Override the testmod source set: skip the common testmod (which is a client
// example mod and cannot compile on Paper) and use only paper/src/testmod/.
sourceSets {
    testmod {
        java.srcDirs = ['src/testmod/java']
        resources.srcDirs = ['src/testmod/resources']
    }
}

dependencies {
    testmodImplementation sourceSets.main.output
    testmodImplementation paperweight.paperDevBundle(paper_version)
}

// Use the paperweight-userdev-bridged `runDevBundleServer` task: it reads the Paper
// version directly from the dev bundle (no run-paper version-table lookup that 2.3.1's
// bundled list doesn't know about 26.1.2). Replace the default pluginJars (which
// includes the library `jar` — has no plugin.yml so Paper errors on it) with just
// the testmod jar, and isolate the run dir + auto-accept EULA for unattended runs.
tasks.named('runDevBundleServer', xyz.jpenilla.runpaper.task.RunServer).configure {
    pluginJars.setFrom(tasks.named('testmodJar'))
    runDirectory(file('run/testmod-server'))
    systemProperty('com.mojang.eula.agree', 'true')
}
