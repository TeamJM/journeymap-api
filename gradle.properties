# Properties for dependency versions

minecraft_version=1.16.5
mappings=1.16.5

# Forge https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=36.2.22
# mcp_config build for 1.16.5 - source of joined.tsrg (obf->srg) used by the forge compile remap.
# The forge userdev jar ships SRG-period MC class names; the remap rewrites them to modern-mojmap
# (matching the minivan-mapped :common) using joined.tsrg + Mojang official client mappings.
mcp_config_version=1.16.5-20210115.111550
# Mojang official 1.16.5 client mappings (proguard, obf<->modern). Immutable content-addressed URL.
mojang_client_mappings_url=https://piston-data.mojang.com/v1/objects/374c6b789574afbdc901371207155661e0509e17/client.txt
mojang_client_mappings_sha1=374c6b789574afbdc901371207155661e0509e17

# Parchment mappings https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.16.5
parchment_version=2022.03.06

# Fabric https://fabricmc.net/develop/
fabric_api_version=0.42.0+1.16
fabric_loader_version=0.19.3

# Journeymap cursemaven version
jm_project_id=32274

forge_jm_file_id=3587042
fabric_jm_file_id=3587042

# Properties for artifact versions
