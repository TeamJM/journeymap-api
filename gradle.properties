# FG7 warns "Renamer Gradle not present with legacy Forge version" because we deliberately do not apply
# the net.minecraftforge.renamer plugin here (see forge/build.gradle): the API's own published jar stays
# MCP-named on purpose, and the downstream 1.12.2 mod shades + reobfuscates the whole fat jar itself at
# package time. Silence the advisory - it is expected, not a misconfiguration.
net.minecraftforge.gradle.warnings.minecraft.legacy.renamer.missing=false
