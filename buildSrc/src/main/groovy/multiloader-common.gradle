plugins {
    id 'java-library'
    id 'maven-publish'
    id 'java'
}

boolean localBuild = (hasProperty("buildProfile") && "local".equals(property("buildProfile")))

base {
    archivesName = "${mod_name}-${project.name}"
}

/* Artifact Version */
version = "${project.minecraft_version}-${project.api_version}"
if (project.snapshot.toBoolean()) {
    version = version + "-SNAPSHOT"
}
group = project.group_id

java {
    withSourcesJar()
    withJavadocJar()
}

// LESSON FROM THE 1.16.5 PORT: a jdk-8 toolchain launcher was UNRELIABLE for enforcing the Java-8 API
// surface - a forked jdk-8 javac still resolved symbols against whatever JRE it actually ran on, so
// post-8 API calls (e.g. List.of / Stream.toList, added in Java 9/16) could slip through compilation
// silently and would NoSuchMethodError at runtime on MC's real Java-8 JRE. Compile with the Gradle
// daemon's own (modern) javac under --release 8 instead - --release enforces the exact Java-8 API
// surface via the shipped ct.sym, turning those latent runtime crashes into compile errors. Only the
// compiler moves; nothing here requests a JDK-8 launcher for running Gradle, tests, or FG7's own tasks.
tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

testing {
    suites {
        test {
            // Explicitly declare the test framework
            useJUnitJupiter() // Use useJUnit() or useTestNG() if applicable
        }
    }
}
sourceSets {
    testmod {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven {
        url "https://www.cursemaven.com"
    }
}
configurations {
    testImplementation.extendsFrom implementation
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    // match MC 1.7.10's bundled Guava 17 (main source uses Guava-17-era Objects.toStringHelper)
    testImplementation group: 'com.google.guava', name: 'guava', version: '17.0'
    // Must match the log4j version Minecraft 1.7.10 ships (log4j-core 2.0-beta9, pulled transitively
    // via com.mojang:authlib / net.minecraft:launchwrapper). A newer log4j-api here wins conflict
    // resolution against MC's pinned core, and the mismatched pair breaks Minecraft's Bootstrap
    // logging init (AbstractMethodError: Log4jContextFactory does not implement
    // LoggerContextFactory#getContext) in tests that boot MC (Bootstrap.register()).
    testImplementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.0-beta9'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'
    // Mockito 5.x is compiled for Java 11 (class version 55) - the 1.16.5 API targets Java 8, so pin
    // to the last Java-8-compatible line (4.11.0). JUnit 5.10.x keeps its Java 8 baseline.
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }

}

tasks.withType(Test) {
    failOnNoDiscoveredTests = false
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.jar.archiveVersion,
                "Implementation-Title"    : project.title,
                "Implementation-Version"  : project.version,
                "Implementation-URL"      : project.git_website,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': getDate(),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

var manifestExpandProps = [
        'version'              : version,
        'group'                : group_id, //Else we target the task's group.
        'minecraft_version'    : minecraft_version,
        'mod_name'             : mod_name,
        'mod_author'           : mod_author,
        'mod_id'               : mod_id,
        "forge_version"        : forge_version,
        'java_version'         : java_version
]

var manifestJsonExpandProps = manifestExpandProps.collectEntries {
    key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
}

processResources {
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'doc/changelog.html']) {
        expand manifestExpandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json', 'mcmod.info']) {
        expand manifestJsonExpandProps
    }

    inputs.properties(manifestExpandProps)
}

// Apply the same variable expansion to the testmod source set so the shared
// example mod's manifests (mods.toml, neoforge.mods.toml, fabric.mod.json) get
// ${version} and friends substituted at build time.
tasks.named('processTestmodResources', ProcessResources) {
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand manifestExpandProps
    }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'paper-plugin.yml']) {
        expand manifestJsonExpandProps
    }
    inputs.properties(manifestExpandProps)
}

/* Javadoc properties */
javadoc {
    title = project.title_javadoc
    // Java 8 javadoc enforces strict doclint; the loader modules compile the common API source in and
    // trip it, failing withJavadocJar(). Disable doclint here so common/fabric/forge javadoc jars build.
    options.addStringOption('Xdoclint:none', '-quiet')
}

def getDate() {
    def date = new Date()
    def formattedDate = date.format(project.dateFormat)
    return formattedDate
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    if (localBuild) {
        repositories {
            maven {
                url System.getenv("local_maven_url") // or `url "file://" + System.getenv("local_maven")`
            }
        }
    } else {
        repositories {
            maven {
                name = "JourneyMap"
                url = uri("https://jm.gserv.me/repository/maven-snapshots/")

                credentials {
                    username = project.findProperty("journeymap.user") ?: System.getenv("JOURNEYMAP_USER")
                    password = project.findProperty("journeymap.password") ?: System.getenv("JOURNEYMAP_PASSWORD")
                }

                version = project.version
            }
        }
    }
}
