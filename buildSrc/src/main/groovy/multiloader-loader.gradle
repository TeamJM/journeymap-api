plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
    testImplementation.extendsFrom compileOnly
}

dependencies {

    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Make common/src/testmod a source dir on this loader's testmod source set so
// the IDE sees the shared example-mod classes as part of the loader project
// (no cross-module phantom imports) and gradle compiles everything in one pass.
sourceSets {
    testmod {
        java.srcDirs += project(':common').file('src/testmod/java')
        resources.srcDirs += project(':common').file('src/testmod/resources')
    }
}

// Package the testmod source set into a jar. Fabric needs this remapped via
// loom; Forge/NeoForge add their own reobf wiring in their build.gradle.
tasks.register('testmodJar', Jar) {
    archiveClassifier = 'testmod-dev'
    from sourceSets.testmod.output
}
