plugins {
    id 'fabric-loom'
    id 'multiloader-loader'
}

def baseName = "${project.mod_name}" + "-fabric"
base.archivesName = baseName


loom {
    mods {
        register('examplemod') {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run/client")
            programArg("--username=Dev")
            source sourceSets.testmod
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run/server")
            source sourceSets.testmod
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testmodImplementation sourceSets.main.output
}

// 26.1 fabric-loom no longer needs intermediary remapping for the testmod jar -
// the base testmodJar task in multiloader-loader.gradle is sufficient.

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    // loom renames/removes some configs across versions (e.g. includeInternal absent in loom 1.17);
    // tolerate missing ones instead of failing the whole evaluation.
    configurations.findByName(variant)?.attributes {
        attribute(loaderAttribute, 'fabric')
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.findByName(variant)?.attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
