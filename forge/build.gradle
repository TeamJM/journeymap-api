plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0,8.0)'
}

def baseName = "${project.mod_name}" + "-forge"
base.archivesName = baseName

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url "https://repo.spongepowered.org/maven" }
}

/* ForgeGradle spec for Minecraft */
minecraft {
    mappings channel: project.mappings_channel, version: project.mappings

    runs {
        register('client') {
            workingDir.convention layout.projectDirectory.dir('run')
        }

        register('server') {
            workingDir.convention layout.projectDirectory.dir('run')
            args '--nogui'
        }
    }
}
sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    testmodImplementation sourceSets.main.output

    // :common uses JetBrains annotations (@Nullable/@ApiStatus) as compileOnly; the forge module
    // compiles that same common source, so it needs them too.
    compileOnly group: 'org.jetbrains', name: 'annotations', version: '24.1.0'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}
